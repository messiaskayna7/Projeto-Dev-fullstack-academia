<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block titulo %}{{ academia.nome }}{% endblock %}</title>
    <style>
      :root {
        --fundo: #f5f7f6;
        --texto: #1d2b27;
        --verde: #1f6f5c;
        --borda: #cfdad6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", Arial, sans-serif;
        background: var(--fundo);
        color: var(--texto);
        line-height: 1.5;
      }
      header {
        background: var(--verde);
        color: #fff;
        padding: 1rem 1.25rem;
      }
      header strong {
        font-size: 1.2rem;
      }
      nav a {
        color: #fff;
        margin-right: 1rem;
        font-weight: bold;
      }
      nav {
        margin-top: 0.5rem;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem;
      }
      .modalidade {
        border-left: 4px solid var(--verde);
        padding: 0.25rem 0 0.25rem 1rem;
        margin-bottom: 1.25rem;
      }
      .modalidade h3 {
        margin: 0;
      }
      .modalidade p {
        margin: 0.25rem 0 0;
      }
      .tabela {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        text-align: left;
        padding: 0.6rem;
        border-bottom: 1px solid var(--borda);
      }
      th {
        background: #e6eeeb;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>{{ academia.nome }}</strong>
      <nav>
        <a href="{% url 'inicio' %}">Início</a>
        <a href="{% url 'turmas' %}">Grade de turmas</a>
      </nav>
    </header>
    <main>{% block conteudo %}{% endblock %}</main>
  </body>
</html>
